workflows:
  golden-system:
    name: Golden System Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android platform
        script: flutter create --platforms=android --org com.goldensystem .
      - name: Get packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Analyze
        script: flutter analyze
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
